[package]
name = "doughbox"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
walkdir = "2.5.0"
deunicode = "1.6.2"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
rust_decimal = { version = "1.42.1", features = ["db-tokio-postgres", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde_json = "1.0.151"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
clap = { version = "4.6.6", features = ["derive"] }
blake3 = "1.8.6"
num-format = "0.4.4"
tabled = "0.20.0"
owo-colors = "4.3.0"
spinners-rs = "2.3.0"
itertools = "0.14.0"
fancy-regex = "0.17.0"
pdf-extract = "0.10.0"
rust_decimal_macros = "1.40.0"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace"] }
tower-sessions = "0.14.0"
tower-cookies = { version = "0.11.0", features = ["signed"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"
anyhow = "1.0.104"
typeshare = "1.0.5"
futures = "0.3.34"
logos = "0.16.1"
log = "0.4.33"

[build-dependencies]
static-files = "0.3.1"
