[package]
name = "doughbox"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
walkdir = "2.5.0"
deunicode = "1.6.2"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
refinery = { version = "0.10.0", features = ["tokio-postgres"] }
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres", "serde", "serde-with-arbitrary-precision", "serde-with-str"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "query", "rustls"] }
serde_json = "1.0.154"
flate2 = "1.1.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
clap = { version = "4.6.7", features = ["derive"] }
blake3 = "1.8.7"
num-format = "0.4.4"
tabled = "0.22.0"
owo-colors = "4.4.0"
spinners-rs = "2.3.0"
itertools = "0.15.0"
fancy-regex = "0.20.0"
pdf-extract = "0.12.1"
rust_decimal_macros = "1.40.0"
axum = { version = "0.8.9", features = ["multipart"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tower-sessions = "0.15.0"
tower-cookies = { version = "0.11.0", features = ["signed"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"
anyhow = "1.0.104"
typeshare = "1.0.5"
futures = "0.3.34"
logos = "0.16.1"
log = "0.4.34"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[build-dependencies]
static-files = "0.3.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
